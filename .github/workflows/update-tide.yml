name: Update Tide Data

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install cheerio

      - name: Fetch Badatime Data
        run: node update-tide.js

      - name: Commit & Push Tide JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tide.json
          git commit -m "auto: scrape real badatime 30-day tide data [skip ci]" || exit 0
          git push
